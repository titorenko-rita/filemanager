<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FileManager{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .container { max-width: 900px; margin-top: 40px; }
        .navbar { margin-bottom: 30px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">FileManager</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{% url 'file_list' %}">Список файлов</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'upload_file' %}">Загрузка</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'ml_results' %}">ML-результаты</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Профиль</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'send_report' %}">Отправить отчет</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
