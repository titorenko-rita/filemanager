{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Регистрация · FileManager{% endblock %}
{% block content %}
<section class="auth-form-container">
  <p class="eyebrow">Новая учётная запись</p><h1>Регистрация</h1>
  <p class="text-muted mb-4">Уже зарегистрированы? <a href="{% url 'account_login' %}">Войдите</a>.</p>
  <form id="signup_form" method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}{{ form|crispy }}
    {% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}
    <button class="btn btn-primary mt-3" type="submit">Создать аккаунт</button>
  </form>
</section>
{% endblock %}
