{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Войти · FileManager{% endblock %}
{% block content %}
<section class="auth-form-container">
  <p class="eyebrow">С возвращением</p><h1>Войти</h1>
  <p class="text-muted mb-4">Нет учётной записи? <a href="{% url 'account_signup' %}">Зарегистрируйтесь</a>.</p>
  <form class="login" method="post" action="{% url 'account_login' %}">
    {% csrf_token %}{{ form|crispy }}
    {% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}
    <button class="btn btn-primary mt-3" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
