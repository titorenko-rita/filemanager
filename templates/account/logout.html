{% extends "base.html" %}
{% block title %}Выйти · FileManager{% endblock %}
{% block content %}
<section class="auth-form-container text-center">
  <p class="eyebrow">Завершение сеанса</p><h1>Выйти?</h1><p class="text-muted">Для продолжения работы потребуется снова ввести логин и пароль.</p>
  <form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<div class="d-flex justify-content-center gap-2 mt-4"><button class="btn btn-primary" type="submit">Выйти</button><a class="btn btn-soft" href="{% url 'file_list' %}">Остаться</a></div></form>
</section>
{% endblock %}
