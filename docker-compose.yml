services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filemanager}
      POSTGRES_USER: ${POSTGRES_USER:-filemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filemanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    restart: always
    networks:
      - backend

  django:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn filemanager.wsgi:application --bind 0.0.0.0:8000 --workers=3 --threads=2"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      # на случай если в .env не задано или задано неверно
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ML_SERVICE_URL: http://ml_service:5000
      USE_POSTGRES: "True"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-filemanager}
      POSTGRES_USER: ${POSTGRES_USER:-filemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filemanager}
    depends_on:
      - db
      - redis
    networks:
      - backend
      - frontend
    restart: always

  celery:
    build: .
    command: celery -A filemanager worker -l info --pool=solo -Q high_priority,low_priority,default
    depends_on:
      - django
      - db
      - redis
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ML_SERVICE_URL: http://ml_service:5000
      USE_POSTGRES: "True"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-filemanager}
      POSTGRES_USER: ${POSTGRES_USER:-filemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filemanager}
    volumes:
      - .:/app
      - media_volume:/app/media
    networks:
      - backend
    restart: always

  ml_service:
    build:
      context: ./ml_api
    ports:
      - "5000:5000"
    networks:
      - backend
    restart: always
    volumes:
      - media_volume:/app/media

  nginx:
    image: nginx:1.25
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - django
    networks:
      - frontend

  prometheus:
    image: prom/prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  backend:
  frontend:
