name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-only-key
          DJANGO_DEBUG: 'False'
      - run: pytest -q
        env:
          DJANGO_SECRET_KEY: ci-only-key
          DJANGO_DEBUG: 'False'
